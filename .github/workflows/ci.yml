name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --configuration Release

      - name: Unit + architecture tests
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~IntegrationTests"

      - name: Integration tests (Testcontainers + real SQL Server)
        run: dotnet test tests/DailyGourmet.Api.IntegrationTests --no-build --configuration Release
